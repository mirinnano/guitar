name: Android CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk guitar-tools-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          path: guitar-tools-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
