name: Release APK

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Resolve release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF_NAME}" =~ ^release/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            RELEASE_VERSION="${BASH_REMATCH[1]}"
          else
            echo "Release ref must be vX.Y.Z or release/vX.Y.Z"
            exit 1
          fi

          if [[ ! "${RELEASE_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use semantic version format, for example v0.1.1"
            exit 1
          fi

          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "${GITHUB_ENV}"

      - name: Validate signing secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "Missing RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "Missing RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "Missing RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "Missing RELEASE_KEY_PASSWORD"; exit 1; }

      - name: Restore release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GETSONGBPM_API_KEY: ${{ secrets.GETSONGBPM_API_KEY }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER" || { echo "apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose "$APK"

      - name: Prepare release assets
        shell: bash
        run: |
          APK_NAME="guitar-tools-${RELEASE_VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: signed-release-apk
          path: guitar-tools-*.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_NAME="guitar-tools-${RELEASE_VERSION}.apk"

          for attempt in {1..60}; do
            if gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release upload "${RELEASE_VERSION}" \
                "$APK_NAME" \
                "$APK_NAME.sha256" \
                --repo "${GITHUB_REPOSITORY}" \
                --clobber
              exit 0
            fi

            echo "Waiting for shared GitHub Release ${RELEASE_VERSION} ($attempt/60)"
            sleep 5
          done

          echo "Shared GitHub Release ${RELEASE_VERSION} was not created in time" >&2
          exit 1
