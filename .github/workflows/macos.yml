name: macOS CI

on:
  push:
    branches: [main]
    paths:
      - "macOS/**"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "macOS/**"
      - ".github/workflows/macos.yml"

concurrency:
  group: macos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-build-package:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Unit tests
        run: swift test --package-path macOS

      - name: Debug build
        run: swift build --package-path macOS

      - name: Package app bundle
        env:
          GETSONGBPM_API_KEY: ${{ secrets.GETSONGBPM_API_KEY }}
        run: |
          chmod +x macOS/scripts/package-app.sh
          macOS/scripts/package-app.sh

      - name: Verify code signature
        run: codesign --verify --deep --strict "macOS/dist/Guitar Tools.app"

      - name: Verify app bundle
        run: |
          plutil -lint "macOS/dist/Guitar Tools.app/Contents/Info.plist"
          test -x "macOS/dist/Guitar Tools.app/Contents/MacOS/GuitarToolsMacApp"
          test -s "macOS/dist/Guitar Tools.app/Contents/Resources/AppIcon.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "macOS/dist/Guitar Tools.app/Contents/Info.plist")" = "AppIcon"
          file "macOS/dist/Guitar Tools.app/Contents/MacOS/GuitarToolsMacApp"
          "macOS/dist/Guitar Tools.app/Contents/MacOS/GuitarToolsMacApp" --smoke-test

      - name: Verify artifact contents
        run: |
          test -d "macOS/dist/Guitar Tools.app"
          test "$(find macOS/dist -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = "1"

      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: Guitar Tools.app
          path: macOS/dist/
          if-no-files-found: error
          retention-days: 14
